<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>個股查詢｜馬上有錢</title>
  <meta name="description" content="輸入股票代號或名稱，查詢昨日收盤資料，並建立自己的觀察清單。資料僅供參考。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="stock">

  <header class="site-header">
    <a class="logo" href="index.html">馬上有錢</a>
    <button class="menu-btn" type="button" aria-label="開啟選單" aria-expanded="false"><span></span><span></span></button>
    <nav class="nav" aria-label="主選單">
      <a href="index.html">首頁</a>
      <a href="rank.html">排行榜</a>
      <a href="stock.html" aria-current="page">個股查詢</a>
      <a href="learn.html">名詞小教室</a>
      <a href="about.html">關於本站</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <img src="images/street.jpg" alt="老街巷弄盡頭遠望台北101">
      <div class="inner">
        <div class="en">Stock Lookup</div>
        <h1>個股查詢</h1>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="sec-head reveal">
          <div class="sec-no">01</div>
          <div>
            <h2>查一檔股票</h2>
            <p>輸入股票代號（例如 2330）或名稱（例如 台積電），可以看到 <span data-date></span> 的收盤資料。</p>
          </div>
        </div>

        <form class="search" id="search-form" role="search">
          <input id="q" type="text" list="stock-list" placeholder="代號或名稱" autocomplete="off" aria-label="股票代號或名稱">
          <datalist id="stock-list"></datalist>
          <button type="submit">查詢</button>
        </form>
        <div class="chips" aria-label="快速查詢">
          <button type="button" data-q="2330">台積電</button>
          <button type="button" data-q="2317">鴻海</button>
          <button type="button" data-q="2454">聯發科</button>
          <button type="button" data-q="0050">元大台灣50</button>
          <button type="button" data-q="0056">元大高股息</button>
        </div>

        <div class="stock-grid">
          <div id="quote" data-needs-data></div>
          <aside class="watch reveal" aria-label="我的觀察清單">
            <h3>我的觀察清單</h3>
            <p class="hint">清單只存在你這台裝置的瀏覽器裡，不會上傳到任何地方。</p>
            <ul id="watch-list"></ul>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <a class="logo" href="index.html">馬上有錢</a>
      <div>
        <p class="warn">本站資料來源為臺灣證券交易所公開資料，於每個交易日收盤後自動更新，內容僅供參考，不構成任何投資建議。投資有風險，請自行判斷並承擔結果。</p>
        <nav aria-label="頁尾選單">
          <a href="rank.html">排行榜</a><a href="stock.html">個股查詢</a><a href="learn.html">名詞小教室</a><a href="about.html">關於本站</a>
        </nav>
      </div>
      <div class="copy"><span>資料日期 <span data-date></span>　更新於 <span data-generated></span></span><span>© 馬上有錢</span></div>
    </div>
  </footer>

  <script src="data/market.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
