# 每個交易日晚上 8 點自動抓證交所收盤資料並更新 data/market.js，隔天早上 7 點再補抓一次
name: 更新股市資料

on:
  schedule:
    - cron: "0 12 * * 1-5"   # UTC 12:00 = 台灣時間週一到週五 20:00（證交所通常傍晚才公布當天資料）
    - cron: "0 23 * * 0-4"   # UTC 23:00 = 台灣時間週一到週五 07:00（開盤前補抓一次）
  workflow_dispatch:          # 也可以在 GitHub 的 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取資料
        run: python scripts/fetch_data.py
      - name: 有變動才存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.js
          git diff --cached --quiet || git commit -m "更新股市資料 $(date +%F)"
          git push
